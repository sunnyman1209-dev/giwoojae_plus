<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
<title>기우제반 플러스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f6f4ef;--card:#fff;--ink:#22201c;--sub:#6b665d;--line:#e2ddd3;
  --pri:#2b2824;--pri-ink:#fff;--ok:#2f7a3b;--ok-bg:#e8f3e6;--no:#c0392b;--no-bg:#fbeae7;
  --mid:#9a6700;--mid-bg:#fff4d6;--chip:#efebe3;--box:#f3efe7;--tag:#7a4b2a;--tag-bg:#f5e9dc;
  --ok-solid:#2f7a3b;--fig-filter:none;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#151412;--card:#1e1d1a;--ink:#ece8e1;--sub:#a29c92;--line:#34312c;
  --pri:#ece8e1;--pri-ink:#1a1916;--ok:#6cc070;--ok-bg:#18281a;--no:#ef7a6e;--no-bg:#331a17;
  --mid:#e3b341;--mid-bg:#2e2510;--chip:#2a2824;--box:#25231f;--tag:#e0b48c;--tag-bg:#33261b;
  --ok-solid:#2f7a3b;--fig-filter:brightness(.86);
}}
::selection{background:var(--tag-bg);color:var(--ink)}
input,textarea{caret-color:var(--tag)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.inp input:focus,.inp textarea:focus,.field input:focus{outline:none;border-color:var(--ink)}
h2{text-wrap:balance}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:17px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;letter-spacing:-.01em;
  font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;letter-spacing:inherit}
.btn,.grid button,.act button,.scope,.sheet-close,.chips button,.home-go,.qnav button{transition:transform .16s cubic-bezier(.2,.7,.2,1),background-color .16s,border-color .16s,box-shadow .16s}
@media (hover:hover){
  .btn:not([disabled]):hover,.grid button:not([disabled]):hover,.scope:hover,.home-go:hover{transform:translateY(-1px);box-shadow:0 4px 12px -6px rgba(40,30,20,.25)}
  .act button:not([disabled]):hover{transform:translateY(-1px)}
}
.btn:not([disabled]):active,.grid button:not([disabled]):active,.act button:not([disabled]):active,.scope:active,.chips button:active,.home-go:active{transform:scale(.98);box-shadow:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px 8px;
  padding-top:calc(10px + env(safe-area-inset-top))}
header:empty{display:none}
.scope{width:100%;max-width:608px;margin:0 auto;display:flex;align-items:center;gap:12px;border:1px solid var(--line);
  background:var(--card);border-radius:14px;padding:8px 8px 8px 14px;text-align:left;cursor:pointer;min-height:52px}
.scope-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.scope-k{font-size:12px;color:var(--sub);font-weight:500}
.scope b{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scope-go{flex:none;display:flex;align-items:center;gap:4px;background:var(--pri);color:var(--pri-ink);
  border-radius:10px;padding:8px 10px 8px 12px;font-size:14px;font-weight:600}
.scope-go svg{width:16px;height:16px}
main{max-width:640px;margin:0 auto;padding:12px 16px calc(120px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;font-size:13px;color:var(--sub)}
.meta span{background:var(--chip);border-radius:6px;padding:2px 8px}
.meta .re{background:var(--mid-bg);color:var(--mid)}
.stem{font-size:18px;font-weight:600;white-space:normal}
.stem table,.md table{border-collapse:collapse;margin:8px 0;font-size:15px;font-weight:400;width:100%}
.stem td,.stem th,.md td,.md th{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
.fig{display:block;max-width:100%;margin:12px auto 0;border-radius:8px;background:#fff;filter:var(--fig-filter)}
.figcap{text-align:center;font-size:12px;color:var(--sub);margin-top:4px}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.ox button{font-size:30px;font-weight:700;padding:18px 0}
.opt{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;text-align:left;cursor:pointer;
  display:flex;gap:10px;align-items:flex-start;width:100%}
.btn .n{font-weight:700;color:var(--sub);flex:none}
.btn.ok{border-color:var(--ok);background:var(--ok-bg)}
.btn.no{border-color:var(--no);background:var(--no-bg)}
.btn.sel{border-color:var(--pri);background:var(--chip)}
.btn[disabled]{cursor:default}
.ox .btn{justify-content:center}
.right-list{margin:14px 0 4px;padding:10px 12px;background:var(--box);border-radius:10px;font-size:15px}
.right-list div{display:flex;gap:6px}
.match-row{border-top:1px solid var(--line);padding:10px 0}
.match-row:first-child{border-top:0}
.match-row .l{font-weight:600;margin-bottom:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-width:46px;padding:8px 0;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:18px;cursor:pointer}
.chips button.sel{border-color:var(--pri);background:var(--pri);color:var(--pri-ink)}
.chips button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.chips button.no{border-color:var(--no);background:var(--no-bg);color:var(--no)}
.inp{display:flex;gap:8px;margin-top:16px;align-items:center}
.inp input,.inp textarea{flex:1;min-width:0;font:inherit;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.inp textarea{min-height:90px;resize:vertical}
.inp .unit{color:var(--sub);white-space:nowrap}
.act{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,var(--bg) 30%);display:flex;justify-content:center;gap:8px;z-index:4}
.act:empty{display:none}
.act button{max-width:608px;flex:1;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;background:var(--pri);color:var(--pri-ink);cursor:pointer}
.act button.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line);flex:0 1 auto;padding:15px 16px}
.act button[disabled]{opacity:.4}
.sheet .act{position:static;background:none;padding:16px 0 0}
.verdict{margin-top:16px;padding:12px 14px;border-radius:12px;font-weight:700;display:flex;gap:8px;align-items:center}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}
.verdict.no{background:var(--no-bg);color:var(--no)}
.verdict.mid{background:var(--mid-bg);color:var(--mid)}
.ex{margin-top:14px;font-size:16px}
.ex h4{margin:20px 0 6px;font-size:15px;font-weight:700;color:var(--ink);padding-bottom:4px;border-bottom:1px solid var(--line)}
.ex h4:first-child{margin-top:4px}
.ex ul,.ex ol{margin:4px 0;padding-left:22px}
.ex li{margin:3px 0}
.ans{font-size:18px;font-weight:700}
.concept{margin-top:14px;background:var(--box);border-radius:12px;padding:12px 14px;font-size:15px}
.concept b.t{display:block;margin-bottom:4px;font-size:15px}
.kw{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.kw label{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer}
.kw input{width:22px;height:22px;accent-color:var(--pri)}
.mine{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--chip);font-size:15px;white-space:pre-wrap}
.link{background:none;border:0;color:var(--pri);padding:8px 0;cursor:pointer;font-weight:600;text-decoration:underline}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.9);background:var(--ok-solid);color:#fff;
  font-size:24px;font-weight:800;padding:16px 30px;border-radius:18px;opacity:0;pointer-events:none;transition:all .15s}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:85vh;overflow:auto;background:var(--card);z-index:11;
  border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));display:none}
.sheet>*{max-width:608px;margin-left:auto;margin-right:auto}
.sheet.on,.sheet-bg.on{display:block}
.sheet.on{animation:sheetIn .28s cubic-bezier(.2,.8,.2,1)}
.sheet-bg.on{animation:fadeIn .2s ease-out}
@keyframes sheetIn{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 12px}
.sheet-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sheet-top h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em}
.sheet-close{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:10px;
  padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer;min-height:40px}
.sheet-close svg{width:16px;height:16px}
.sheet h3{margin:22px 0 8px;font-size:13px;font-weight:600;color:var(--sub);letter-spacing:0}
.sheet h3:first-of-type{margin-top:10px}
.sheet p{font-size:15px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.grid button{position:relative;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 12px 10px;
  text-align:left;cursor:pointer;font-size:15px;font-weight:600;line-height:1.35;display:flex;flex-direction:column;gap:6px;min-height:68px}
.grid button small{color:var(--sub);font-size:12px;font-weight:500;margin-top:auto}
.grid button .ck{position:absolute;top:10px;right:10px;width:18px;height:18px;display:none}
.grid button.sel{border-color:var(--pri);background:var(--pri);color:var(--pri-ink)}
.grid button.sel small{color:inherit;opacity:.7}
.grid button.sel .ck{display:block}
.grid button.wrong:not(.sel):not([disabled]){background:var(--tag-bg);border-color:transparent;color:var(--tag)}
.grid button.wrong:not(.sel):not([disabled]) small{color:var(--tag);opacity:.8}
.grid button[disabled]{opacity:.45;cursor:default}
.switch{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--pri);flex:none}
.switch span{display:flex;flex-direction:column;line-height:1.35}
.switch small{color:var(--sub);font-size:13px}
.done{text-align:center;padding:30px 10px}
.stats{display:flex;justify-content:center;gap:24px;margin:16px 0;font-size:15px;color:var(--sub)}
.stats b{display:block;font-size:26px;color:var(--ink)}
.self-note{margin:0 0 6px;font-size:13px;color:var(--sub)}
.self-list{list-style:none;margin:0;padding:0}
.self-list li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.self-list li span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.self-list button{flex:none;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--ink);cursor:pointer;font-size:13px}
.foot{margin-top:28px;text-align:center;font-size:12px;color:var(--sub)}
.foot button{background:none;border:0;color:var(--sub);text-decoration:underline;cursor:pointer;font-size:12px;padding:6px 4px}
.home h1{font-size:26px;margin:8px 0 4px;letter-spacing:-.02em}
.home p{color:var(--sub);margin:0 0 18px;font-size:15px}
.home-go{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:18px 16px;cursor:pointer;margin-bottom:10px}
.home-go b{display:block;font-size:19px}
.home-go small{color:var(--sub);font-size:14px}
.ebar{max-width:608px;margin:0 auto;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 8px 8px 14px;min-height:52px}
.ebar .tm{font-size:20px;font-weight:800;min-width:72px}
.ebar .tm.low{color:var(--no)}
.ebar .no{flex:1;color:var(--sub);font-size:15px}
.ebar button{border:0;background:var(--pri);color:var(--pri-ink);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer}
.qnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px}
.qnav button{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px 0;font-size:15px;font-weight:600;cursor:pointer}
.qnav button.has{background:var(--chip);border-color:var(--chip)}
.qnav button.now{border-color:var(--pri)}
.qnav button.ok{background:var(--ok-bg);border-color:var(--ok-bg);color:var(--ok)}
.qnav button.no{background:var(--no-bg);border-color:var(--no-bg);color:var(--no)}
.notice{background:var(--box);border-radius:12px;padding:12px 14px;font-size:15px;margin:14px 0 0}
.notice ul{margin:0;padding-left:20px}
.notice li{margin:4px 0}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label{font-size:14px;color:var(--sub);font-weight:600}
.field input{font:inherit;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.big-score{font-size:56px;font-weight:800;line-height:1.1;margin:10px 0}
.addr{display:block;margin-top:10px;font-size:13px;color:var(--sub);word-break:break-all}
.open-chrome{display:inline-block;margin-top:12px;background:var(--pri);color:var(--pri-ink);text-decoration:none;border-radius:12px;padding:12px 18px;font-weight:700}
.rv{border-top:1px solid var(--line);padding:16px 0}
.rv .h{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--sub);margin-bottom:4px}
.rv .h b.ok{color:var(--ok)} .rv .h b.no{color:var(--no)}
.rv details{margin-top:8px}
.rv .selfbtn{margin-top:8px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--ok);background:var(--card);color:var(--ok);font-weight:600;font-size:15px;cursor:pointer}
.rv .selfbtn.undo{border-color:var(--line);color:var(--sub)}
.rv summary{cursor:pointer;color:var(--sub);font-size:14px;padding:4px 0}
.rv ul{margin:6px 0;padding-left:22px;font-size:15px}
.muted{color:var(--sub);font-size:14px}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="main"><div class="card">불러오는 중…</div></main>
<div class="act" id="act"></div>
<div class="toast" id="toast">정답!</div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<script>
"use strict";
/* 구글 시트 웹 앱 주소(apps-script/기우제플러스.gs 배포 후 넣는다). 비어 있으면 시험·신고 전송을 하지 않는다. */
const SHEET_URL = "https://script.google.com/macros/s/AKfycbwb5ZbfyTaYW1Xr6ZEFJFIZ9ylF1bnw1sBhi9kkU8sfis_gY4E9EPstPi8-nJ5reiPY/exec";
const VER = "plus-1";
/* 기존 앱(gwq1)과 같은 출처를 쓰므로 저장 키를 따로 둔다 (SPEC 3절) */
const K_LEARN = "gwp_learn1", K_EXAM = "gwp_exam1", K_NAME = "gwp_name", K_REPORT = "gwp_report1", K_SUGGEST = "gwp_suggest1";
const CIRC = "①②③④⑤⑥", PAIR = "㉠㉡㉢㉣㉤㉥";
const CHECK = '<svg class="ck" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5l3.2 3L14 5.5"/></svg>';
const XICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>';

/* ---------- 도구 ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}
function md(text){
  const lines=Array.isArray(text)?text:String(text||"").split("\n");let h="",i=0;
  while(i<lines.length){const L=lines[i];
    if(/^\s*\|/.test(L)){let rows=[];while(i<lines.length&&/^\s*\|/.test(lines[i])){rows.push(lines[i]);i++}
      rows=rows.filter(r=>!/^\s*\|[\s:|-]+\|\s*$/.test(r));
      h+="<table>"+rows.map((r,ri)=>"<tr>"+r.trim().replace(/^\||\|$/g,"").split("|").map(c=>`<${ri?"td":"th"}>${inline(c.trim())}</${ri?"td":"th"}>`).join("")+"</tr>").join("")+"</table>";continue}
    if(/^\s*-\s+/.test(L)){let it=[];while(i<lines.length&&/^\s*-\s+/.test(lines[i])){it.push(lines[i].replace(/^\s*-\s+/,""));i++}
      h+="<ul>"+it.map(x=>`<li>${inline(x)}</li>`).join("")+"</ul>";continue}
    if(L.trim())h+=`<div>${inline(L)}</div>`;i++}
  return h}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function canUseStorage(){try{localStorage.setItem("__gwp","1");const ok=localStorage.getItem("__gwp")==="1";localStorage.removeItem("__gwp");return ok}catch(e){return false}}

/* ===== ENGINE-START (tools/test_engine.js 가 이 구간을 떼어 시험한다) ===== */
/* 채점용 정규화: 띄어쓰기·대소문자·괄호 안 글자·구두점 무시 (기존 앱과 같음) */
const norm=s=>String(s||"").toLowerCase().normalize("NFC").replace(/\([^)]*\)/g,"").replace(/[\s·,.\-_'"“”‘’()（）\[\]]/g,"");
const rint=n=>Math.floor(Math.random()*n);
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rint(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

/* 계산형 공식 표 (해설집 계산 단계의 공식과 같다, SPEC 5절). 데이터는 이름만 가리킨다 */
const FORMULAS={
  fz:v=>v.F/(v.Z*v.N),                  // 날당 이송 fz = F ÷ (Z × N)
  feedF:v=>v.fz*v.Z*v.N,                // 이송속도 F = fz × Z × N [mm/min]
  feedFm:v=>v.fz*v.Z*v.N/1000,          // 같은 식 [m/min]
  turnF:v=>v.Q*1000/(v.V*1000*v.t),     // 선반 이송 f = Q ÷ (V × t)
  rpm:v=>1000*v.V/(3.14*v.D),           // N = 1000V ÷ (πD), π = 3.14
  rpm3:v=>1000*v.V/(3*v.D),             // π = 3
  vc:v=>3.14*v.D*v.N/1000,              // V = πDN ÷ 1000
  tapF:v=>v.N*v.P,                      // 탭 이송 F = N × 리드(1줄 = 피치)
  drill:v=>v.D-v.P,                     // 기초 드릴 d = D − p
  micro:v=>v.P/v.n*v.k,                 // 마이크로미터 이동량
  microRead:v=>v.S+v.P/v.n*v.k,         // 마이크로미터 읽음 = 슬리브 + 심블 눈금 × (피치 ÷ 등분 수)
  vernier:v=>1/v.n,                     // 버니어 최소 눈금 = 1 ÷ 등분 수
  tol:v=>v.U-v.L,                       // 치수 공차
  maxClear:v=>v.HU-v.SL,                // 최대 틈새
  maxInterf:v=>v.SU-v.HL,               // 최대 죔새
  dwell:v=>60/v.N*v.k                   // 드웰 시간
};

    if(/^[A-Za-z]/.test(x)){if(!(x in vars))throw Error("변수 "+x);return vars[x]}

  function expr(){let v=term();while(peek()==="+"||peek()==="-"){const o=take(),r=term();v=o==="+"?v+r:v-r}return v}
  return expr()}

/* CBT 시험지 조합 (SPEC 7-1): [유형, 문항 수, 배점] */
const EXAM_PLAN=[["진위형",2,2],["연결형",3,2],["4지선다",25,2],["단답형",8,4],["계산형",2,4]];
const tagKey=q=>norm(q.tag&&q.tag.box)+"|"+norm(q.tag&&q.tag.item);
function buildExam(questions){
  const C=questions.filter(q=>q.cbt);
  const pool={};EXAM_PLAN.forEach(([t])=>pool[t]={old:shuffled(C.filter(q=>q.t===t&&q.src!=="new")),new:shuffled(C.filter(q=>q.t===t&&q.src==="new"))});
  // 새 문항 목표: 진위 1, 단답 4, 계산 1, 연결·4지는 합 14를 무작위로 나눔 → 전체 20
  const m=1+rint(2),want={"진위형":1,"연결형":m,"4지선다":14-m,"단답형":4,"계산형":1};
  const take={};let short=0;
  for(const [t,n] of EXAM_PLAN){take[t]=Math.min(want[t],pool[t].new.length,n);short+=want[t]-take[t]}
  for(const [t,n] of shuffled(EXAM_PLAN)){if(!short)break;   // 모자란 새 문항은 다른 유형에서 더 뽑는다
    const add=Math.min(Math.min(pool[t].new.length,n)-take[t],short);take[t]+=add;short-=add}
  // 한 시험 안에서 같은 꼬리표 금지, 원본과 그 변형 동시 출제 금지
  const usedTag=new Set(),usedId=new Set(),kids={};
  C.forEach(q=>{if(q.from)(kids[q.from]=kids[q.from]||[]).push(q.id)});
  const blocked=q=>usedTag.has(tagKey(q))||usedId.has(q.id);
  const use=q=>{usedTag.add(tagKey(q));usedId.add(q.id);if(q.from)usedId.add(q.from);(kids[q.id]||[]).forEach(x=>usedId.add(x))};
  const items=[];
  for(const [t,n] of EXAM_PLAN){
    const got=[],add=q=>{got.push(q);use(q)};
    for(const q of pool[t].new){if(got.length>=take[t])break;if(!blocked(q))add(q)}
    for(const q of pool[t].old){if(got.length>=n)break;if(!blocked(q))add(q)}
    for(const q of pool[t].new){if(got.length>=n)break;if(!got.includes(q)&&!blocked(q))add(q)}
    for(const q of pool[t].old.concat(pool[t].new)){if(got.length>=n)break;if(!got.includes(q)&&!usedId.has(q.id))add(q)} // 마지막 수단: 꼬리표 제한을 풂
    shuffled(got).forEach(q=>items.push(Object.assign({id:q.id},makeInst(q))))}

/* 학습 기록 st{res,retry,self}에서 맞음 표시(on) 또는 되돌리기. 원래 결과는 self에 남겨 되돌릴 때 쓴다 */

/* 시험 결과: 기기에 남긴 기록(시험지 items, 답 a)만으로 제출 때와 같은 결과를 다시 만든다(SPEC_1124 D)

function resume(rec){E=rec;ei=Math.min(E.at||0,E.items.length-1);
  if(Date.now()>=E.deadline){submit(true);return}
  renderQ();clearInterval(timer);timer=setInterval(tick,1000)}
function tick(){if(!E||E.done){clearInterval(timer);return}
  const s=Math.max(0,Math.ceil((E.deadline-Date.now())/1000));
  const el=$("tm");if(el){el.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;el.classList.toggle("low",s<=300)}
  if(s<=0){clearInterval(timer);submit(true)}}
function answered(i){const a=E.a[i];if(a==null||a==="")return false;
  if(!Array.isArray(a))return true;const q=BYID[E.items[i].id];
  return !!(q&&q.left)&&a.length>=q.left.length&&!a.some(x=>x==null)}
function renderQ(){

  acts.push(ei<E.items.length-1?{t:"다음",f:()=>{ei++;E.at=ei;esave();renderQ()}}:{t:"제출",f:askSubmit});
  if(!q){   // 시험 도중 문항 데이터가 바뀌어 이 문항이 없어진 경우(0점 처리)

  if(q.t==="진위형"){
    ui.innerHTML=`<div class="ox">${["O","X"].map(x=>`<button class="btn${a===x?" sel":""}" data-v="${x}">${x}</button>`).join("")}</div>`;
    ui.querySelectorAll("button").forEach(b=>b.onclick=()=>{save(b.dataset.v);ui.querySelectorAll("button").forEach(x=>x.classList.toggle("sel",x===b))});
  }else if(q.t==="4지선다"){
    ui.innerHTML=`<div class="opt">${v.choices.map((c,i)=>`<button class="btn${a===i?" sel":""}" data-i="${i}"><span class="n">${CIRC[i]}</span><span>${inline(c)}</span></button>`).join("")}</div>`;
    ui.querySelectorAll("button").forEach(b=>b.onclick=()=>{save(+b.dataset.i);ui.querySelectorAll("button").forEach(x=>x.classList.toggle("sel",x===b))});
  }else if(q.t==="연결형"){

      row.querySelectorAll("button").forEach(b=>{if(cur[r]===+b.dataset.j)b.classList.add("sel");

    $("in").oninput=e=>save(e.target.value.trim());

function openNav(){
  let h=sheetTop("문항 목록")+`<p>색칠된 번호는 답을 적은 문항입니다.</p><div class="qnav">${E.items.map((_,i)=>`<button class="${answered(i)?"has":""}${i===ei?" now":""}" data-i="${i}">${i+1}</button>`).join("")}</div>`;

  openSheet(h,"문항 목록");
  $("sheet").querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{ei=+b.dataset.i;E.at=ei;esave();closeSheet();renderQ()});
  $("navSubmit").onclick=()=>{closeSheet();askSubmit()}}
function askSubmit(){
  const blank=E.items.filter((_,i)=>!answered(i)).length;
  if(!confirm(blank?`답을 적지 않은 문항이 ${blank}개 있습니다. 제출하시겠습니까?`:"제출하시겠습니까? 제출하면 고칠 수 없습니다."))return;
  submit(false)}
function submit(auto){
  if(!E||E.done)return;clearInterval(timer);closeSheet();   // 문항 목록을 연 채 시간이 끝나도 목록이 남지 않게
  const r=examResult(BYID,E);
  E.done=Date.now();E.score=r.score;E.auto=!!auto;
  // 제출 번호는 기기에서 만들어 함께 보낸다. 다시 보내도 시트에 한 줄만 남고, 시트가 돌려준 번호를 기기에 저장한다.
  if(!E.sid)E.sid=(Date.now().toString(36)+Math.random().toString(36).slice(2,8)+"000000").slice(0,12);
  E.self=[];E.marks=examMarks(BYID,E);   // 결과 다시 보기도 이 채점을 따른다(시트와 같은 점수)
  E.payload={kind:"exam",round:E.round,name:E.name,score:r.score,marks:E.marks,leaves:E.leaves||0,sid:E.sid,
    started:new Date(E.started).toISOString(),submitted:new Date(E.done).toISOString(),browser:BROWSER_TEXT,ver:VER};
  esave();showReview(E)}
/* 시험 기록 전송: 시트 응답(제출 번호 포함)을 돌려준다. 실패 false, 서버 없음 null */
function postExam(obj){
  if(!SHEET_URL)return Promise.resolve(null);
  return fetch(SHEET_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(obj)})
    .then(r=>r.json()).then(j=>j&&j.ok===true?j:j&&j.error?{ok:false,error:String(j.error)}:false,()=>false)}
/* 한 기록은 한 번에 하나만 보낸다. 끊김·서버 혼잡(동시 제출 대기 초과)이면 잠시 뒤 세 번까지 저절로 다시 보낸다 */
const SEND_BUSY=new Set();
function sendRec(rec,tries){
  if(rec.sent||!rec.payload||rec.round==="연습")return;
  const key=rec.payload.sid||rec.sid;if(SEND_BUSY.has(key))return;SEND_BUSY.add(key);tries=tries||0;
  const st=$("sendSt");if(st&&E===rec)st.textContent="기록을 보내는 중…";
  postExam(rec.payload).then(j=>{
    SEND_BUSY.delete(key);
    const ok=!!(j&&j.ok),rejected=!!(j&&j.error==="bad data");
    // 기다리는 사이 '내 시험 결과'를 다시 열어 기록을 새로 읽었으면 지금 기록에도 반영한다(제출 번호로 찾음)
    const cur=EX&&EX.recs.find(r=>r!==rec&&r.payload&&r.payload.sid===key);
    if(ok){[rec,cur].forEach(x=>{if(x){x.sent=true;if(j.sid)x.sid=String(j.sid)}});esave();sendFix(cur||rec)}
    const again=!ok&&j!==null&&!rejected&&tries<3;
    if(again)setTimeout(()=>sendRec(cur||rec,tries+1),(4+tries*6)*1000+rint(3000));
    const el=$("sendSt");if(!el||(E!==rec&&E!==cur))return;
    if(ok)el.textContent="기록을 보냈습니다.";
    else if(j===null)el.textContent="시험 서버가 연결되지 않아 기록을 보내지 못했습니다. 이 화면을 선생님께 보여 주십시오.";
    else{el.innerHTML=(rejected?"시트가 이 기록을 받지 않았습니다(회차가 바뀌었을 수 있습니다). 이 화면을 선생님께 보여 주십시오. ":
        again?"기록을 보내지 못했습니다. 잠시 뒤 다시 보냅니다. ":"기록을 보내지 못했습니다. 인터넷 연결을 확인하십시오. ")+`<button class="link" id="resend">다시 보내기</button>`;
      $("resend").onclick=()=>sendRec(rec)}})}
function resendPending(){EX.recs.filter(r=>r.done&&!r.sent&&r.payload&&r.round!=="연습").forEach(r=>sendRec(r));
  EX.recs.filter(r=>r.done&&r.sent&&r.fixPending).forEach(sendFix)}
window.addEventListener("online",()=>{if(EX)resendPending()});   // 인터넷이 다시 연결되면 못 보낸 기록을 보낸다
/* 시험 점수 고치기(SPEC_1124 D): 지금 맞음 처리한 문항 번호 집합을 보낸다. 시트가 배점으로 다시 계산한다.
   한 기록에 요청은 하나씩만 보내고, 보내는 동안 또 바뀌면 끝난 뒤 마지막 상태로 한 번 더 보낸다 */
const FIX_BUSY=new Set();
const FIX_ERR={sid:"시트에서 이 제출을 찾지 못했습니다. 선생님께 이 화면을 보여 주십시오.",num:"이 문항은 맞음으로 표시할 수 없습니다.",old:"이 제출은 점수를 고칠 수 없습니다. 선생님께 이 화면을 보여 주십시오."};
function fixMsg(t){const el=$("fixSt");if(el)el.innerHTML=t}
function sendFix(rec){
  if(!rec.fixPending||!rec.sent||rec.round==="연습"||!rec.sid)return;
  if(FIX_BUSY.has(rec.sid))return;
  if(!SHEET_URL){fixMsg("시험 서버가 연결되지 않아 고친 점수를 보내지 못했습니다.");return}
  FIX_BUSY.add(rec.sid);const nums=(rec.self||[]).map(i=>i+1).sort((x,y)=>x-y),key=nums.join(","),seq=rec.fixSeq||0;
  const same=x=>(x.self||[]).map(i=>i+1).sort((a,b)=>a-b).join(",")===key&&(x.fixSeq||0)===seq;   // 보낸 상태(문항 번호 + 순번)와 같은가
  if(E===rec)fixMsg("고친 점수를 보내는 중…");
  fetch(SHEET_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({kind:"fix",sid:rec.sid,nums,seq,ver:VER})})
    .then(r=>r.json()).catch(()=>null).then(j=>{
      FIX_BUSY.delete(rec.sid);
      const done=!!(j&&(j.ok||FIX_ERR[j.error])),err=j&&!j.ok?FIX_ERR[j.error]||"":"";
      // 기다리는 사이 결과를 다시 열어 기록을 새로 읽었으면 그 기록(cur)도 같은 상태일 때만 끝난 것으로 한다
      const cur=EX&&EX.recs.find(r=>r!==rec&&r.sid===rec.sid&&r.fixPending);
      [rec,cur].forEach(x=>{if(x&&done&&same(x)){x.fixPending=false;x.fixErr=err}});
      if(done)esave();
      const next=[rec,cur].find(x=>x&&x.fixPending&&!same(x));   // 보내는 동안 또 바뀜: 마지막 상태로 다시 보낸다
      if(next)return sendFix(next);
      const mine=E===rec?rec:E===cur?cur:null;if(!mine)return;
      if(j&&j.stale)fixMsg("다른 화면에서 나중에 고친 점수가 이미 시트에 기록되어 있습니다.");
      else if(done)fixMsg(j.ok?"고친 점수를 선생님 시트에 기록했습니다.":esc(err));
      else{fixMsg(`고친 점수를 보내지 못했습니다. <button class="link" id="refix">다시 보내기</button>`);$("refix").onclick=()=>sendFix(mine)}})}
function toggleSelf(rec,i,on){
  const r0=examResult(BYID,rec).rows[i];if(!r0||!r0.selfable||rec.round==null)return;
  rec.self=(rec.self||[]).filter(x=>x!==i);if(on)rec.self.push(i);
  rec.score=examResult(BYID,rec).score;rec.fixPending=rec.round!=="연습";rec.fixErr="";rec.fixSeq=Date.now();esave();
  if(on&&rec.round!=="연습"&&BYID[rec.items[i].id])suggestAnswer(BYID[rec.items[i].id],r0.mine,"시험 단답형");
  showReview(rec,i)}
/* 시험 결과: 제출 직후와 '내 시험 결과'에서 같은 화면(SPEC_1124 D) */

    <p class="muted">맞힌 문항 ${r.ok.filter(Boolean).length} / ${rec.items.length}</p>

      else if(q.t==="연결형"&&Array.isArray(a))mine=a.map((j,k)=>`${CIRC[k]}-${j==null?"?":PAIR[j]}`).join(", ");
      else mine=String(a)}
    const row=r.rows[i],sb=row.selfable?`<button class="selfbtn${row.self?" undo":""}" data-self="${i}">${row.self?"되돌리기":"맞음으로 표시"}</button>`:"";
    return `<div class="rv" id="rv${i}"><div class="h"><b class="${r.ok[i]?"ok":"no"}">${i+1}번 ${row.self?"스스로 맞음 처리":r.ok[i]?"맞음":"틀림"}</b><span>${esc(q.t)} · ${r.rows[i].pts} / ${r.rows[i].max}점</span></div>
      <div class="stem" style="font-size:16px">${md(v.stem)}</div>${figHtml(q)}
      ${v.choices?`<ul>${v.choices.map((c,k)=>`<li>${CIRC[k]} ${inline(c)}</li>`).join("")}</ul>`:""}
      ${q.t==="연결형"?`<div class="right-list">${q.left.map((l,k)=>`<div><b>${CIRC[k]}</b><span>${inline(l)}</span></div>`).join("")}${q.right.map((x,k)=>`<div><b>${PAIR[k]}</b><span>${inline(x)}</span></div>`).join("")}</div>`:""}
      <div class="mine">내 답: ${esc(mine)}</div>
      <div class="mine">정답: ${inline(v.ansText)}</div>${sb}
      <details${r.ok[i]?"":" open"}><summary>해설</summary>${exHtml(q,v,{noAns:true})}</details></div>`}).join("");
  ecard(h);
  $("main").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>$("rv"+b.dataset.go).scrollIntoView({behavior:"smooth"}));
  $("main").querySelectorAll("[data-self]").forEach(b=>b.onclick=()=>{const i=+b.dataset.self;toggleSelf(rec,i,!(rec.self||[]).includes(i))});
  if(at!=null&&$("rv"+at))$("rv"+at).scrollIntoView({block:"center"});
  setAct([{t:"처음 화면",g:1,f:()=>{location.hash=""}},{t:"내 시험 결과",f:()=>{if(location.hash==="#exam-results")myResults();else location.hash="exam-results"}}]);
  sendRec(rec);sendFix(rec)}
/* 탭 이탈 횟수: 시험 중 화면이 가려질 때마다 1 더한다 */
document.addEventListener("visibilitychange",()=>{
  if(document.hidden&&E&&E.started&&!E.done&&/^#exam/.test(location.hash)){E.leaves=(E.leaves||0)+1;esave()}
  if(!document.hidden&&E&&!E.done)tick()});

/* =====================================================================
   교사용 화면 (#teacher) — 처음 화면에는 단추가 없고 주소로만 들어온다.
   비밀번호는 시트 스크립트 속성에만 있고, 이 기기에는 탭을 닫을 때까지만 남긴다.
   ===================================================================== */
const K_TPW="gwp_tpw";
let TV={round:""};
function tpwGet(){try{return sessionStorage.getItem(K_TPW)||""}catch(e){return ""}}
function tpwSet(v){try{v?sessionStorage.setItem(K_TPW,v):sessionStorage.removeItem(K_TPW)}catch(e){}}
function adminCall(action,extra){
  if(!SHEET_URL)return Promise.resolve({ok:false,error:"none"});
  const body=Object.assign({kind:"admin",pw:tpwGet(),action},extra||{});
  return fetch(SHEET_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)})
    .then(r=>r.json()).catch(()=>({ok:false,error:"net"}))}
const ADMIN_ERR={pw:"비밀번호가 틀렸습니다.",locked:"비밀번호를 여러 번 틀려 10분 동안 막혔습니다. 잠시 뒤 다시 시도하십시오.",nopw:"시트 스크립트에 비밀번호가 아직 저장되지 않았습니다. 시트 스크립트 편집기에서 '설정하기'를 실행하십시오.",demo:"'연습'은 연습 화면용 이름이라 회차 이름으로 쓸 수 없습니다. 다른 이름을 적으십시오.",
  round:"회차를 적으십시오(예: 8회차).",none:"시험 서버가 연결되지 않았습니다.",net:"서버에 연결하지 못했습니다. 인터넷을 확인하십시오."};
function teacher(){
  clearAuto();clearInterval(timer);E=null;$("hdr").innerHTML="";
  if(!tpwGet())return teacherLogin();
  ecard("현황을 불러오는 중…");const my=NAV;
  adminCall("status",{round:TV.round}).then(r=>{if(my===NAV)teacherView(r)})}
function teacherLogin(msg){
  ecard(`<h2>교사용 화면</h2>${msg?`<p class="muted">${esc(msg)}</p>`:""}
    <div class="field"><label for="tpw">비밀번호</label><input id="tpw" type="password" autocomplete="off"></div>`);
  const go=()=>{const v=$("tpw").value;if(!v.trim())return;tpwSet(v);teacher()};   // 시트는 비밀번호를 그대로 비교하므로 앞뒤 공백을 떼지 않는다
  $("tpw").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();go()}};$("tpw").focus();
  setAct([{t:"처음 화면",g:1,f:()=>{location.hash=""}},{t:"들어가기",f:go}])}
function teacherView(r){
  if(!r||!r.ok){if(r&&(r.error==="pw"||r.error==="locked"))tpwSet("");
    if(r&&(r.error==="pw"||r.error==="locked"||r.error==="nopw"))return teacherLogin(ADMIN_ERR[r.error]);
    ecard(`<h2>교사용 화면</h2><p>${esc(ADMIN_ERR[r&&r.error]||"오류가 났습니다.")}</p>`);
    setAct([{t:"처음 화면",g:1,f:()=>{location.hash=""}},{t:"다시 시도",f:teacher}]);return}
  const c=r.cfg||{},open=c.state==="열림";TV.round=r.round||"";
  const rows=r.rows||[],first=rows.filter(x=>/첫 응시/.test(x.status));
  const opts=[...new Set([c.round,...(r.rounds||[])].filter(Boolean))];
  const fmt=s=>{const d=new Date(s);return isNaN(d)?esc(s):`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`};
  ecard(`<h2>교사용 화면</h2>
    <div class="notice"><b>지금 상태: ${open?"열림":"닫힘"}</b> · 회차 ${esc(c.round||"(없음)")} · 제한 시간 ${esc(c.minutes||30)}분</div>
    <div class="field"><label for="tround">회차(기록표 회차 이름과 똑같이)</label><input id="tround" maxlength="20" autocomplete="off" value="${esc(c.round||"")}" placeholder="예: 8회차"></div>
    <div class="field"><label for="tmin">제한 시간(분)</label><input id="tmin" type="number" min="1" max="180" inputmode="numeric" value="${esc(c.minutes||30)}"></div>
    <p class="muted">시험을 열면 학생이 시험 화면에서 시작할 수 있습니다. 학생은 제출 직후 점수·정답·해설을 봅니다. 학생이 단답형을 '맞음으로 표시'하면 점수가 고쳐지고 원래 점수와 문항 번호가 함께 보입니다(기록표용 CSV는 고친 점수). 닫은 뒤 제출은 '마감 후'로 기록됩니다.</p>
    <h3 style="margin:22px 0 8px;font-size:16px">결과</h3>
    ${opts.length>1?`<div class="field"><label for="tsel">회차 고르기</label><select id="tsel">${opts.map(o=>`<option${o===TV.round?" selected":""}>${esc(o)}</option>`).join("")}</select></div>`:""}
    <p>${esc(TV.round||"(회차 없음)")}: 제출 ${rows.length}건, 첫 응시 ${first.length}명</p>
    ${rows.length?`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:14px">
      <tr><th style="text-align:left;padding:4px">이름</th><th style="padding:4px">점수</th><th style="padding:4px">이탈</th><th style="text-align:left;padding:4px">상태</th><th style="text-align:left;padding:4px">맞음 처리</th><th style="padding:4px">제출</th></tr>
      ${rows.map(x=>`<tr style="border-top:1px solid #8884"><td style="padding:4px">${esc(x.name)}</td><td style="text-align:center">${esc(x.score)}${x.orig!==""&&x.orig!=null?`<br><small class="muted">원래 ${esc(x.orig)}</small>`:""}</td><td style="text-align:center">${esc(x.leaves)}</td><td style="padding:4px">${esc(x.status)}</td><td style="padding:4px">${x.self?esc(x.self)+"번":""}</td><td style="text-align:center">${fmt(x.at)}</td></tr>`).join("")}
    </table></div>`:'<p class="muted">아직 제출이 없습니다.</p>'}`);
  if($("tsel"))$("tsel").onchange=e=>{TV.round=e.target.value;teacher()};
  const busy=(p)=>{ecard("처리하는 중…");const my=NAV;return p.then(r=>{if(my===NAV)teacherView(r)})};
  const acts=[{t:"새로고침",g:1,f:teacher}];
  // 내려받는 순간의 점수(학생이 그 사이 고친 점수 포함)를 쓰도록 현황을 다시 읽어 만든다
  if(first.length)acts.push({t:"기록표용 CSV",g:1,f:()=>{const round=TV.round;adminCall("status",{round}).then(x=>{
    if(x&&x.ok)downloadCsv(round,(x.rows||[]).filter(y=>/첫 응시/.test(y.status)));else alert(ADMIN_ERR[x&&x.error]||"현황을 다시 읽지 못했습니다.")})}});
  acts.push(open?{t:"시험 닫기",f:()=>busy(adminCall("close",{round:TV.round}))}
    :{t:"시험 열기",f:()=>{const round=$("tround").value.trim(),minutes=+$("tmin").value||30;if(!round){$("tround").focus();return}
      TV.round=round;busy(adminCall("open",{round,minutes}))}});
  setAct(acts)}
function downloadCsv(round,first){
  const q=s=>/[",\n]/.test(s)?`"${String(s).replace(/"/g,'""')}"`:String(s);
  const csv="﻿이름,점수\n"+first.map(x=>q(x.name)+","+q(x.score)).join("\n")+"\n";
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download=`기록표용_${round||"회차"}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

/* =====================================================================
   처음 화면·주소 나누기 (#learn 학습, #exam 시험, #exam-demo 연습, #exam-results 내 시험 결과, #teacher 교사용)
   ===================================================================== */
function home(){
  clearAuto();clearInterval(timer);E=null;$("hdr").innerHTML="";setAct([]);
  $("main").innerHTML=`<div class="home"><h1>기우제반 플러스</h1><p>컴퓨터응용가공산업기사 외부평가 대비</p>
    <button class="home-go" id="goLearn"><b>학습</b><small>문제은행 ${DB.questions.length}문항을 한 문제씩 무작위로 풉니다. 기록은 이 기기에만 남습니다.</small></button>
    <button class="home-go" id="goExam"><b>시험(CBT)</b><small>선생님이 연 모의고사를 봅니다. 크롬에서만 볼 수 있습니다.</small></button>${eload().recs.some(r=>r&&r.done)?`<button class="home-go" id="goRes"><b>내 시험 결과</b><small>이 기기에서 제출한 시험의 점수, 정답, 해설을 다시 봅니다.</small></button>`:""}</div>`;
  $("goLearn").onclick=()=>{location.hash="learn"};$("goExam").onclick=()=>{location.hash="exam"};if($("goRes"))$("goRes").onclick=()=>{location.hash="exam-results"}}
let NAV=0;   // 화면을 옮길 때마다 1 늘린다. 늦게 온 서버 응답이 옮긴 뒤 화면을 덮어쓰지 않게 비교한다
function route(){
  NAV++;closeSheet();const h=location.hash;
  if(h==="#teacher")teacher();
  else if(/^#exam/.test(h))startExam();
  else if(h==="#learn"){clearInterval(timer);E=null;startLearn()}
  else home()}
window.addEventListener("hashchange",route);
$("sheetBg").onclick=closeSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("sheet").classList.contains("on"))closeSheet()});
fetch("data/questions.json").then(r=>r.json()).then(d=>{DB=d;d.questions.forEach(q=>BYID[q.id]=q);route()})
  .catch(()=>{$("main").innerHTML='<div class="card">문항을 불러오지 못했습니다. 새로고침해 주십시오.</div>'});
</script>
